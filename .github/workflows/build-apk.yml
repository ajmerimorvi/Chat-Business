name: Build Android Native APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    name: Build Native APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/Sampark-v1.0.0.apk
          ls -la output-apk/

      - name: Upload APK as Artifact (Direct Phone Download)
        uses: actions/upload-artifact@v4
        with:
          name: Sampark-Native-APK
          path: output-apk/Sampark-v1.0.0.apk
          retention-days: 30
